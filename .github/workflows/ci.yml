name: CI

on:
  push:
    branches: [main, 'vyvoj/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  core:
    name: Build and tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: .NET 10 SDK
        run: |
          if ! dotnet --list-sdks 2>/dev/null | grep -q '^10\.'; then sudo apt-get update -q && sudo apt-get install -y -q dotnet-sdk-10.0; fi
          dotnet --list-sdks
      - name: Build
        run: bash tools/ci/dotnet.sh build Polaris.slnx -c Release -p:PublishAot=false
      - name: Code format (.editorconfig)
        run: dotnet format whitespace --folder . --verify-no-changes
      - name: Tests
        run: dotnet run --project tests/Polaris.Tests -c Release --no-build
      - name: polaris-centrum for Linux (natively compiled) and its HTTPS server
        run: |
          bash tools/ci/dotnet.sh publish src/Polaris.Centrum -c Release -r linux-x64 -o out/centrum-linux
          bin=$PWD/out/centrum-linux/polaris-centrum
          work=$(mktemp -d)
          "$bin" --subor "$work/centrum.json" server certifikat localhost 127.0.0.1 | tee "$work/cert.txt"
          test "$(stat -c %a "$work/server.key")" = "600" || { echo "::error::súkromný kľúč nie je chránený"; exit 1; }
          "$bin" --subor "$work/centrum.json" server --port 18443 & pid=$!
          for i in $(seq 20); do curl -sk https://127.0.0.1:18443/v1/stav && break; sleep 0.5; done | tee "$work/stav.txt"
          grep -q '"polaris":"centrum"' "$work/stav.txt" || { echo "::error::centrum neodpovedá"; kill $pid; exit 1; }
          code=$(curl -sk -o /dev/null -w '%{http_code}' -X POST https://127.0.0.1:18443/v1/stav)
          test "$code" = "405" || { echo "::error::centrum prijalo zápis ($code)"; kill $pid; exit 1; }
          kill -TERM $pid; wait $pid; echo "server skončil kódom $?"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polaris-centrum-linux
          path: |
            out/centrum-linux/polaris-centrum
            tools/debian/polaris-centrum.service
            docs/centrum.md

  windows:
    name: Build, tests, agent and tools (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: .NET 10 SDK
        run: |
          if (-not (dotnet --list-sdks 2>$null | Select-String '^10\.')) {
            Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $env:RUNNER_TEMP/dotnet-install.ps1
            & $env:RUNNER_TEMP/dotnet-install.ps1 -Channel 10.0 -InstallDir "$env:ProgramFiles/dotnet"
          }
          dotnet --list-sdks
      - name: Build and tests
        run: |
          dotnet build Polaris.slnx -c Release -p:PublishAot=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Polaris.Tests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: polaris-lab.exe (natively compiled, one file)
        run: |
          dotnet publish src/Polaris.Lab -c Release -r win-x64 -o out/lab
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $size = [math]::Round((Get-Item out/lab/polaris-lab.exe).Length / 1MB, 1)
          $version = & ./out/lab/polaris-lab.exe verzia
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "::notice title=polaris-lab.exe::$version, $size MB"
      - name: Check of the runner (changes nothing)
        run: |
          $text = (& ./out/lab/polaris-lab.exe kontrola) -join "`n"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $text
          "::notice title=kontrola na runneri::$($text -replace '%', '%25' -replace "`n", '%0A')"
      - name: polaris-centrum.exe (natively compiled, one file)
        run: |
          dotnet publish src/Polaris.Centrum -c Release -r win-x64 -o out/centrum
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./out/centrum/polaris-centrum.exe pomoc | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: polaris-agent.exe (natively compiled, one file) and the sample recipe
        run: |
          dotnet publish src/Polaris.Agent -c Release -r win-x64 -o out/agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/Polaris.Student -c Release -r win-x64 -o out/agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./out/agent/polaris-agent.exe overit recepty/ukazka-kancelarsky.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # the sample software sets: valid, only stable versions, and what this PC would change
          foreach ($set in 'zaklad', 'multimedia', 'kancelaria', 'ucitel') {
            & ./out/agent/polaris-agent.exe overit "recepty/ukazka-softver-$set.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ./out/agent/polaris-agent.exe kontrola "recepty/ukazka-softver-$set.json"
            if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          }
          # read only: what would change on the runner (exit code 1 = differences, that is fine here)
          $plan = (& ./out/agent/polaris-agent.exe kontrola recepty/ukazka-kancelarsky.json) -join "`n"
          if ($LASTEXITCODE -gt 1) { $plan; exit $LASTEXITCODE }
          $plan
          "::notice title=kontrola receptu na runneri::$($plan -replace '%', '%25' -replace "`n", '%0A')"
          & ./out/agent/polaris-agent.exe kontrola recepty/ukazka-relacia.json
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          & ./out/agent/polaris-agent.exe kontrola recepty/ukazka-pieskovisko.json
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          & ./out/agent/polaris-agent.exe kontrola recepty/ukazka-zaklad.json
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          & ./out/agent/polaris-agent.exe kontrola recepty/ukazka-sluzby.json
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          & ./out/agent/polaris-agent.exe kontrola recepty/ukazka-slabe-pc.json
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          # programs starting by themselves for all users, and the measurements (read only)
          & ./out/agent/polaris-agent.exe spustanie
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./out/agent/polaris-agent.exe meranie
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # drivers: devices without a driver (1 = some are missing, fine here), then a backup checked file by file
          & ./out/agent/polaris-agent.exe ovladace
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          & ./out/agent/polaris-agent.exe ovladace zaloha "$env:RUNNER_TEMP\zaloha-ovladacov" --meno RUNNER
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./out/agent/polaris-agent.exe ovladace overit "$env:RUNNER_TEMP\zaloha-ovladacov"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # the icon in a pupil's position (no admin group, owner = the user) with each part of its protection
          & ./out/agent/polaris-agent.exe skuska-ikony
          if ($LASTEXITCODE -ne 0) { "ikona s plnou ochranou ako žiak padla"; exit 1 }
          # may the system account (the agent's service) change the time zone? (the runner's admin may not)
          schtasks /create /tn PolarisPriv /ru SYSTEM /sc once /st 23:59 /f /tr "cmd /c whoami /priv > C:\polaris-priv.txt" | Out-Null
          schtasks /run /tn PolarisPriv | Out-Null
          Start-Sleep 5
          $tz = Select-String -Path C:\polaris-priv.txt -Pattern SeTimeZonePrivilege
          schtasks /delete /tn PolarisPriv /f | Out-Null
          if (-not $tz) { "systém nemá SeTimeZonePrivilege"; exit 1 }
          "::notice title=systém a časové pásmo::$tz"
          # the trezor of profiles as the system (the service's account: backup and restore privileges)
          $agent = (Resolve-Path ./out/agent/polaris-agent.exe).Path
          Set-Content C:\polaris-trezor.cmd -Encoding ascii -Value "@echo off`r`nwhoami /priv > C:\polaris-trezor-priv.txt`r`n`"$agent`" skuska-trezoru > C:\polaris-trezor.txt 2>&1`r`necho %ERRORLEVEL% > C:\polaris-trezor-kod.txt"
          schtasks /create /tn PolarisTrezor /ru SYSTEM /sc once /st 23:59 /f /tr C:\polaris-trezor.cmd | Out-Null
          schtasks /run /tn PolarisTrezor | Out-Null
          for ($i = 0; $i -lt 60 -and -not (Test-Path C:\polaris-trezor-kod.txt); $i++) { Start-Sleep 2 }
          schtasks /delete /tn PolarisTrezor /f | Out-Null
          Get-Content C:\polaris-trezor.txt -Encoding utf8
          Select-String -Path C:\polaris-trezor-priv.txt -Pattern 'Backup|Restore|Security|Owner'
          if ((Get-Content C:\polaris-trezor-kod.txt -ErrorAction SilentlyContinue).Trim() -ne '0') { "skúška trezoru ako systém zlyhala"; exit 1 }
          # the service: installed into Program Files, running, then removed
          & ./out/agent/polaris-agent.exe instalovat-sluzbu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $svc = Get-Service PolarisAgent
          if ($svc.Status -ne 'Running') { "služba nebeží: $($svc.Status)"; exit 1 }
          Start-Sleep -Seconds 3
          if ((Get-Service PolarisAgent).Status -ne 'Running') { "služba spadla"; exit 1 }
          # maintenance: the service holds a request of Windows that the PC must not sleep, and lets it go
          & ./out/agent/polaris-agent.exe nespat 5m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Sleep -Seconds 25
          $requests = (powercfg /requests) -join "`n"
          if ($requests -notmatch 'POLARIS:') { $requests; "služba nedrží požiadavku údržby"; exit 1 }
          & ./out/agent/polaris-agent.exe nespat koniec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Sleep -Seconds 25
          if (((powercfg /requests) -join "`n") -match 'POLARIS:') { "požiadavka údržby ostala po konci"; exit 1 }
          # the School store answers through the service's pipe; this PC has no catalogue, so it is closed
          $store = (& ./out/agent/polaris-agent.exe obchod zoznam) -join "`n"
          $store
          if ($store -notmatch 'zatvorený') { "Školský obchod neodpovedal ako má"; exit 1 }
          # the pupil's icon (natively compiled): draws itself through Windows and asks the running service
          if (-not (Test-Path "$env:ProgramFiles\POLARIS\polaris-ziak.exe")) { "ikona sa neskopírovala"; exit 1 }
          $report = Join-Path $env:RUNNER_TEMP 'ikona.txt'
          $p = Start-Process -FilePath ./out/agent/polaris-ziak.exe -ArgumentList '--skuska', $report -Wait -PassThru
          if ($p.ExitCode -ne 0) { "skúška ikony: kód $($p.ExitCode)"; exit 1 }
          $menu = Get-Content $report -Raw -Encoding utf8
          $menu
          if ($menu -notmatch 'zatvorený' -or $menu -notmatch '64 px') { "ponuka ikony nie je ako má byť"; exit 1 }
          & ./out/agent/polaris-agent.exe odinstalovat-sluzbu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Get-Service PolarisAgent -ErrorAction SilentlyContinue) { "služba ostala"; exit 1 }
          $global:LASTEXITCODE = 0
      - name: Helper scripts parse as PowerShell; the pilot goes to the top of the package
        run: |
          foreach ($file in 'tools/windows/pilot-k0.cmd', 'tools/windows/doplnit-ovladace.cmd') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseInput([IO.File]::ReadAllText($file, [Text.Encoding]::UTF8), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { "${file}: $($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          }
          Copy-Item tools/windows/pilot-k0.cmd pilot-k0.cmd
      - name: The pilot script runs both phases on the runner (no restart, no pupil session)
        run: |
          $env:POLARIS_PILOT_CI = '1'
          $console = (cmd /c "pilot-k0.cmd < nul" 2>&1 | Out-String) + (cmd /c "pilot-k0.cmd < nul" 2>&1 | Out-String) + (cmd /c "pilot-k0.cmd < nul" 2>&1 | Out-String)
          $log = Join-Path ([Environment]::GetFolderPath('Desktop')) 'POLARIS-pilot.txt'
          if (-not (Test-Path $log)) { $console; "záznam pilota chýba"; exit 1 }
          Get-Content $log -Raw -Encoding utf8
          if ($console -match 'CategoryInfo|ParserError|is not recognized') { $console; "chyba v skripte pilota"; exit 1 }
          if ((Get-Content $log -Raw -Encoding utf8) -notmatch 'fáza 3') { "fáza 3 neprebehla"; exit 1 }
          & ./out/agent/polaris-agent.exe odinstalovat-sluzbu
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polaris-agent-windows
          path: |
            pilot-k0.cmd
            out/agent/polaris-agent.exe
            out/agent/polaris-ziak.exe
            recepty/*.json
            docs/recept.md
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polaris-centrum-windows
          path: out/centrum/polaris-centrum.exe
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polaris-lab-windows
          path: out/lab/polaris-lab.exe
          retention-days: 14
